<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-success"><i class="bi bi-box-seam me-2"></i>Quản lý Sản Phẩm (Product)</h3>
        <div>
            <a href="/home" class="btn btn-outline-primary me-2"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
            <a href="/admin/category-ajax" class="btn btn-outline-secondary me-2">Qua trang Danh mục</a>
            <button class="btn btn-primary" onclick="openAddProductModal()">
                <i class="bi bi-plus-circle me-1"></i> Thêm Sản Phẩm
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <select class="form-select" id="filterCategory" onchange="searchProducts(0)">
                            <option value="">-- Tất cả danh mục --</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="input-group">
                        <input type="text" id="prodKeyword" class="form-control" 
				        placeholder="Nhập tên sản phẩm cần tìm..." 
				        onkeyup="if(event.key === 'Enter') searchProducts(0);">
                        <button class="btn btn-success" onclick="searchProducts(0)"><i class="bi bi-search"></i> Tìm kiếm</button>
                        <button class="btn btn-outline-secondary" onclick="resetSearchProduct()">Làm mới</button>
                    </div>
                </div>
                <div class="col-md-3 text-end">
                    <span class="badge bg-success fs-6" id="totalProducts">0 sản phẩm</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered align-middle mb-0" id="productTable">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 5%;">ID</th>
                        <th style="width: 12%;" class="text-center">Hình ảnh</th>
                        <th style="width: 30%;">Tên sản phẩm</th>
                        <th style="width: 15%;" class="text-center">Danh mục</th>
                        <th style="width: 13%;" class="text-end">Giá</th>
                        <th style="width: 10%;" class="text-center">Số lượng</th>
                        <th style="width: 15%;" class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" id="prodPaginationNav" style="display: none;">
        <ul class="pagination justify-content-center" id="prodPagination"></ul>
    </nav>

    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="addProductForm" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Thêm Sản Phẩm Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="productName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                            <select class="form-select" name="categoryId" id="add_categoryId" required></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="any" class="form-control" name="unitPrice" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" name="quantity" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Giảm giá (VNĐ)</label>
                            <input type="number" step="any" class="form-control" name="discount" value="0">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Hình ảnh đại diện</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Mô tả sản phẩm</label>
                            <textarea class="form-control" name="description" rows="2"></textarea>
                        </div>
                        <input type="hidden" name="status" value="1">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Lưu Sản Phẩm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="editProductForm" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Cập Nhật Sản Phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body row g-3">
                        <input type="hidden" id="edit_productId" name="productId">
                        <div class="col-md-8">
                            <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="edit_productName" name="productName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                            <select class="form-select" id="edit_categorySelect" name="categoryId" required></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="any" class="form-control" id="edit_unitPrice" name="unitPrice" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="edit_quantity" name="quantity" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Giảm giá (VNĐ)</label>
                            <input type="number" step="any" class="form-control" id="edit_discount" name="discount" value="0">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Chọn ảnh mới (để trống nếu giữ nguyên ảnh cũ)</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Mô tả sản phẩm</label>
                            <textarea class="form-control" id="edit_description" name="description" rows="2"></textarea>
                        </div>
                        <input type="hidden" name="status" value="1">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-warning">Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentProdPage = 0;
        const PROD_PAGE_SIZE = 5;

        function loadCategoriesForSelect() {
            const query = `
                query {
                    allCategories {
                        categoryId
                        categoryName
                    }
                }
            `;
            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query: query }),
                success: function(res) {
                    if (res.data && res.data.allCategories) {
                        let filterOptions = '<option value="">-- Tất cả danh mục --</option>';
                        let modalOptions = '<option value="">-- Chọn danh mục --</option>';
                        res.data.allCategories.forEach(c => {
                            let opt = `<option value="${c.categoryId}">${c.categoryName}</option>`;
                            filterOptions += opt;
                            modalOptions += opt;
                        });
                        $('#filterCategory').html(filterOptions);
                        $('#add_categoryId').html(modalOptions);
                        $('#edit_categorySelect').html(modalOptions);
                    }
                }
            });
        }

        function searchProducts(page = 0) {
            currentProdPage = page;
            let kw = $('#prodKeyword').val().trim();
            let catId = $('#filterCategory').val() || null;

            const query = `
                query GetProductPage($kw: String, $cId: ID, $p: Int, $s: Int) {
                    productsPage(keyword: $kw, categoryId: $cId, page: $p, size: $s) {
                        content {
                            productId
                            productName
                            unitPrice
                            quantity
                            description
                            discount
                            images
                            category {
                                categoryId
                                categoryName
                            }
                        }
                        totalPages
                        totalElements
                        pageNumber
                    }
                }
            `;

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    query: query,
                    variables: { kw: kw, cId: catId, p: page, s: PROD_PAGE_SIZE }
                }),
                success: function(res) {
                    if (res.data && res.data.productsPage) {
                        let pageData = res.data.productsPage;
                        renderProductRows(pageData.content);
                        $('#totalProducts').text(pageData.totalElements + " sản phẩm");
                        renderProdPagination(pageData.totalPages, pageData.pageNumber);
                    }
                }
            });
        }

        function renderProductRows(products) {
            let rows = '';
            if (products && products.length > 0) {
                products.forEach(p => {
                    let imgSrc = p.images ? '/uploads/' + p.images : 'https://placehold.co/60x60?text=No+Img';
                    let catName = p.category ? p.category.categoryName : 'Chưa phân loại';
                    let catId = p.category ? p.category.categoryId : '';
                    let desc = p.description ? p.description.replace(/"/g, '&quot;') : '';

                    rows += `
                        <tr>
                            <td class="fw-bold text-center">${p.productId}</td>
                            <td class="text-center">
                                <img src="${imgSrc}" class="rounded border" style="width: 55px; height: 55px; object-fit: cover;">
                            </td>
                            <td class="fw-semibold">${p.productName}</td>
                            <td class="text-center"><span class="badge bg-info text-dark">${catName}</span></td>
                            <td class="text-end fw-bold text-danger">${Number(p.unitPrice).toLocaleString()} đ</td>
                            <td class="text-center">${p.quantity}</td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-1" 
                                    onclick="openEditProduct(${p.productId}, '${encodeURIComponent(p.productName)}', ${p.unitPrice}, ${p.quantity}, '${catId}', '${encodeURIComponent(desc)}', ${p.discount || 0})">
                                    <i class="bi bi-pencil"></i> Sửa
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.productId})">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                rows = '<tr><td colspan="7" class="text-center text-muted py-4">Không tìm thấy sản phẩm nào.</td></tr>';
            }
            $('#productTable tbody').html(rows);
        }

        function renderProdPagination(totalPages, activePage) {
            if (totalPages <= 1) {
                $('#prodPaginationNav').hide();
                return;
            }
            $('#prodPaginationNav').show();
            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `
                    <li class="page-item ${i === activePage ? 'active' : ''}">
                        <a class="page-link" href="javascript:void(0)" onclick="searchProducts(${i})">${i + 1}</a>
                    </li>
                `;
            }
            $('#prodPagination').html(html);
        }

        function resetSearchProduct() {
            $('#prodKeyword').val('');
            $('#filterCategory').val('');
            searchProducts(0);
        }

        function openAddProductModal() {
            $('#addProductForm')[0].reset();
            $('#addProductModal').modal('show');
        }

        $('#addProductForm').submit(function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/api/product/addProduct',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function(res) {
                    if (res.status) {
                        $('#addProductModal').modal('hide');
                        $('#addProductForm')[0].reset();
                        searchProducts(currentProdPage);
                    } else {
                        alert('Thất bại: ' + res.message);
                    }
                },
                error: function(err) {
                    alert('Lỗi: ' + (err.responseJSON ? err.responseJSON.message : 'Không thể thêm sản phẩm!'));
                }
            });
        });

        function openEditProduct(id, name, price, qty, catId, desc, disc) {
            $('#edit_productId').val(id);
            $('#edit_productName').val(decodeURIComponent(name));
            $('#edit_unitPrice').val(price);
            $('#edit_quantity').val(qty);
            $('#edit_categorySelect').val(catId);
            $('#edit_description').val(decodeURIComponent(desc));
            $('#edit_discount').val(disc);
            $('#editProductModal').modal('show');
        }

        $('#editProductForm').submit(function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/api/product/updateProduct',
                type: 'PUT',
                data: formData,
                contentType: false,
                processData: false,
                success: function(res) {
                    if (res.status) {
                        $('#editProductModal').modal('hide');
                        $('#editProductForm')[0].reset();
                        searchProducts(currentProdPage);
                    } else {
                        alert('Cập nhật thất bại: ' + res.message);
                    }
                },
                error: function(err) {
                    alert('Lỗi cập nhật: ' + (err.responseJSON ? err.responseJSON.message : 'Thao tác không thành công!'));
                }
            });
        });

        function deleteProduct(id) {
            if (confirm('Bạn có chắc muốn xóa sản phẩm ID: ' + id + '?')) {
                $.ajax({
                    url: '/api/product/deleteProduct?productId=' + id,
                    type: 'DELETE',
                    success: function(res) {
                        if (res.status) {
                            searchProducts(currentProdPage);
                        } else {
                            alert(res.message);
                        }
                    },
                    error: function(xhr) {
                        alert(xhr.responseJSON ? xhr.responseJSON.message : 'Lỗi hệ thống khi xóa sản phẩm!');
                    }
                });
            }
        }

        $(document).ready(function() {
            loadCategoriesForSelect();
            searchProducts(0);
        });
    </script>
</body>
</html>
