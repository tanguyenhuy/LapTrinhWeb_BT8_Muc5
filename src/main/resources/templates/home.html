<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-diagram-3-fill me-2"></i>Shop Huy Tân </a>
        <div class="d-flex gap-2">
            <a href="/graphiql" target="_blank" class="btn btn-outline-info btn-sm"><i class="bi bi-terminal"></i> GraphiQL Console</a>
            <a href="/admin/category-ajax" class="btn btn-outline-light btn-sm">Quản lý Category</a>
            <a href="/admin/product-ajax" class="btn btn-outline-light btn-sm">Quản lý Product</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label fw-bold">1. Lọc theo Category</label>
                    <select class="form-select" id="categoryFilter" onchange="filterByCategory(this.value)">
                        <option value="">-- Xem tất cả danh mục --</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold">2. Tìm kiếm sản phẩm</label>
                    <div class="input-group">
                        <input type="text" id="keywordInput" class="form-control" 
					       placeholder="Nhập tên sản phẩm..." 
					       onkeyup="if(event.key === 'Enter') searchProducts(0);">
                        <button class="btn btn-primary" onclick="searchProducts()"><i class="bi bi-search"></i> Tìm</button>
                    </div>
                </div>
                <div class="col-md-3 text-md-end pt-4">
                    <button class="btn btn-success w-100" onclick="loadProductsByPriceAsc()">
                        <i class="bi bi-sort-numeric-down"></i> Giá Thấp Đến Cao
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0 text-dark" id="viewTitle">Tất cả sản phẩm (Sắp xếp theo giá tăng dần)</h4>
        <span class="badge bg-secondary" id="totalItems">0 sản phẩm</span>
    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="productGrid">

    </div>

    <nav class="mt-4" id="paginationNav" style="display: none;">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<script>
    const GRAPHQL_URL = '/graphql';
    let currentPage = 0;
    let currentCategoryId = null;

    function callGraphQL(queryStr, variables = {}) {
        return $.ajax({
            url: GRAPHQL_URL,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                query: queryStr,
                variables: variables
            })
        });
    }

    function loadCategories() {
        const query = `
            query {
                allCategories {
                    categoryId
                    categoryName
                }
            }
        `;
        callGraphQL(query).done(function(res) {
            let list = res.data.allCategories;
            let options = '<option value="">-- Tất cả danh mục --</option>';
            list.forEach(c => {
                options += `<option value="${c.categoryId}">${c.categoryName}</option>`;
            });
            $('#categoryFilter').html(options);
        });
    }

    function loadProductsByPriceAsc() {
        $('#viewTitle').text("Tất cả sản phẩm (Giá từ thấp đến cao)");
        $('#paginationNav').hide();
        $('#categoryFilter').val('');
        $('#keywordInput').val('');

        const query = `
            query {
                productsByPriceAsc {
                    productId
                    productName
                    unitPrice
                    quantity
                    images
                    category {
                        categoryName
                    }
                }
            }
        `;

        callGraphQL(query).done(function(res) {
            let list = res.data.productsByPriceAsc;
            renderProductCards(list);
            $('#totalItems').text(list.length + " sản phẩm");
        });
    }

    function filterByCategory(categoryId) {
        if (!categoryId) {
            loadProductsByPriceAsc();
            return;
        }
        currentCategoryId = categoryId;
        $('#paginationNav').hide();
        $('#viewTitle').text("Sản phẩm thuộc danh mục đang chọn");

        const query = `
            query GetByCat($catId: ID!) {
                productsByCategory(categoryId: $catId) {
                    productId
                    productName
                    unitPrice
                    quantity
                    images
                    category {
                        categoryName
                    }
                }
            }
        `;

        callGraphQL(query, { catId: categoryId }).done(function(res) {
            let list = res.data.productsByCategory;
            renderProductCards(list);
            $('#totalItems').text(list.length + " sản phẩm");
        });
    }

    function searchProducts(page = 0) {
        currentPage = page;
        let keyword = $('#keywordInput').val();
        let catId = $('#categoryFilter').val() || null;
        $('#viewTitle').text("Kết quả tìm kiếm & Phân trang");

        const query = `
            query Search($kw: String, $cId: ID, $p: Int, $s: Int) {
                productsPage(keyword: $kw, categoryId: $cId, page: $p, size: $s) {
                    content {
                        productId
                        productName
                        unitPrice
                        quantity
                        images
                        category {
                            categoryName
                        }
                    }
                    totalPages
                    totalElements
                    pageNumber
                }
            }
        `;

        callGraphQL(query, { kw: keyword, cId: catId, p: page, s: 8 }).done(function(res) {
            let pageData = res.data.productsPage;
            renderProductCards(pageData.content);
            $('#totalItems').text(pageData.totalElements + " sản phẩm");
            renderPagination(pageData.totalPages, pageData.pageNumber);
        });
    }

    // Render danh sách thẻ Product HTML
    function renderProductCards(products) {
        let html = '';
        if (!products || products.length === 0) {
            html = '<div class="col-12 text-center text-muted py-5">Không có sản phẩm nào.</div>';
        } else {
            products.forEach(p => {
                let img = p.images ? '/uploads/' + p.images : 'https://placehold.co/300x200?text=No+Image';
                let cat = p.category ? p.category.categoryName : 'Khác';
                html += `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0">
                            <img src="${img}" class="card-img-top" style="height: 180px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-info text-dark mb-2 align-self-start">${cat}</span>
                                <h6 class="card-title fw-bold text-truncate">${p.productName}</h6>
                                <p class="text-danger fw-bold fs-5 mb-1">${Number(p.unitPrice).toLocaleString()} đ</p>
                                <small class="text-muted mb-3">Kho còn: ${p.quantity}</small>
                                <button class="btn btn-outline-primary btn-sm mt-auto" onclick="quickDeleteProduct(${p.productId})">
                                    <i class="bi bi-trash"></i> Xóa nhanh
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        $('#productGrid').html(html);
    }

    function renderPagination(totalPages, page) {
        if (totalPages <= 1) {
            $('#paginationNav').hide();
            return;
        }
        $('#paginationNav').show();
        let html = '';
        for (let i = 0; i < totalPages; i++) {
            html += `
                <li class="page-item ${i === page ? 'active' : ''}">
                    <a class="page-link" href="javascript:void(0)" onclick="searchProducts(${i})">${i + 1}</a>
                </li>
            `;
        }
        $('#pagination').html(html);
    }

    function quickDeleteProduct(id) {
        if (!confirm('Xóa sản phẩm ID ' + id )) return;
        const mutation = `
            mutation Del($pId: ID!) {
                deleteProduct(id: $pId)
            }
        `;
        callGraphQL(mutation, { pId: id }).done(function(res) {
            if (res.data.deleteProduct) {
                alert('Đã xóa thành công!');
                loadProductsByPriceAsc();
            } else {
                alert('Xóa thất bại!');
            }
        });
    }

    $(document).ready(function() {
        loadCategories();
        loadProductsByPriceAsc();
    });
</script>
</body>
</html>
